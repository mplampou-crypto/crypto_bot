<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bybit Bot Dashboard</title>
<style>
  :root{
    --bg:#0c0e14; --panel:#141823; --panel2:#1b2030; --line:#262c3d;
    --txt:#e6e9f0; --muted:#8b93a7; --green:#00d68f; --red:#ff4d6d;
    --accent:#4d8dff; --amber:#ffb84d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:14px;line-height:1.5}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 18px 60px}
  header{display:flex;align-items:center;justify-content:space-between;
    flex-wrap:wrap;gap:12px;margin-bottom:22px}
  h1{font-size:20px;margin:0;font-weight:600;letter-spacing:.3px}
  .pill{font-size:11px;padding:3px 10px;border-radius:999px;font-weight:600;
    text-transform:uppercase;letter-spacing:.5px}
  .pill.live{background:rgba(255,77,109,.15);color:var(--red)}
  .pill.test{background:rgba(77,141,255,.15);color:var(--accent)}
  .updated{color:var(--muted);font-size:12px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:12px;margin-bottom:24px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px}
  .card .label{color:var(--muted);font-size:11px;text-transform:uppercase;
    letter-spacing:.6px;margin-bottom:6px}
  .card .val{font-size:24px;font-weight:600}
  .green{color:var(--green)} .red{color:var(--red)} .muted{color:var(--muted)}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;
    color:var(--muted);margin:28px 0 12px}
  .strat{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;margin-bottom:12px}
  .strat-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .strat-name{font-weight:600;font-size:15px}
  .dot{width:8px;height:8px;border-radius:50%}
  .dot.on{background:var(--green)} .dot.off{background:#3a4153}
  .tag{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--panel2);
    color:var(--muted)}
  .tag.long{background:rgba(0,214,143,.15);color:var(--green)}
  .tag.short{background:rgba(255,77,109,.15);color:var(--red)}
  .strat-desc{color:var(--muted);font-size:13px;margin:10px 0 12px}
  .metrics{display:flex;gap:22px;flex-wrap:wrap}
  .metric .m-label{font-size:10px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--muted)}
  .metric .m-val{font-size:16px;font-weight:600;margin-top:2px}
  table{width:100%;border-collapse:collapse;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:10px 14px;font-size:13px;
    border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;
    letter-spacing:.5px;background:var(--panel2)}
  tr:last-child td{border-bottom:none}
  td.r,th.r{text-align:right}
  .empty{color:var(--muted);text-align:center;padding:26px}
  .err{color:var(--amber);font-size:12px;margin-top:8px}
  @media(max-width:560px){.card .val{font-size:20px}.metrics{gap:16px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div style="display:flex;align-items:center;gap:12px">
      <h1>Bybit Bot</h1>
      <span id="mode" class="pill test">…</span>
    </div>
    <div class="updated">ενημ. <span id="upd">—</span> · auto 5s</div>
  </header>

  <div class="cards" id="cards"></div>

  <h2>Στρατηγικές</h2>
  <div id="strats"></div>

  <h2>Πρόσφατα Trades</h2>
  <div id="trades"></div>
  <div class="err" id="err"></div>
</div>

<script>
const fmt = (n,d=2)=> (n==null||isNaN(n)) ? "—" : Number(n).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const sign = n => (n>0?"+":"") + fmt(n);
const cls  = n => n>0?"green":(n<0?"red":"");
const when = t => { if(!t) return "—"; const d=new Date(t); return d.toLocaleString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}); };

async function load(){
  try{
    const r = await fetch("/api/stats");
    const d = await r.json();
    document.getElementById("err").textContent = "";
    render(d);
  }catch(e){
    document.getElementById("err").textContent = "⚠ δεν φορτώθηκαν δεδομένα: " + e;
  }
}

function render(d){
  const mode = document.getElementById("mode");
  mode.textContent = d.testnet ? "TESTNET" : "LIVE";
  mode.className = "pill " + (d.testnet ? "test" : "live");
  document.getElementById("upd").textContent = new Date().toLocaleTimeString();

  const o = d.overall;
  document.getElementById("cards").innerHTML = `
    ${card("Equity (USDT)", d.equity==null?"—":fmt(d.equity))}
    ${card("Total PnL", sign(o.pnl), cls(o.pnl))}
    ${card("Win Rate", o.win_rate+"%")}
    ${card("Trades", o.trades)}
    ${card("Wins / Losses", `<span class="green">${o.wins}</span> / <span class="red">${o.losses}</span>`)}
  `;

  document.getElementById("strats").innerHTML =
    d.strategies.map(stratCard).join("") ||
    `<div class="strat empty">καμία στρατηγική</div>`;

  const t = d.recent;
  if(!t.length){
    document.getElementById("trades").innerHTML = `<div class="strat empty">κανένα κλεισμένο trade ακόμη</div>`;
  }else{
    document.getElementById("trades").innerHTML = `
      <table><thead><tr>
        <th>Χρόνος</th><th>Στρατηγική</th><th>Σύμβολο</th><th>Πλευρά</th>
        <th class="r">Entry</th><th class="r">Exit</th>
        <th class="r">PnL</th><th class="r">%</th><th>Αποτ.</th>
      </tr></thead><tbody>
      ${t.map(x=>`<tr>
        <td>${when(x.exit_time)}</td>
        <td>${x.strategy}</td>
        <td>${x.symbol}</td>
        <td><span class="tag ${x.side}">${x.side}</span></td>
        <td class="r">${fmt(x.entry_price)}</td>
        <td class="r">${fmt(x.exit_price)}</td>
        <td class="r ${cls(x.pnl)}">${sign(x.pnl)}</td>
        <td class="r ${cls(x.pnl_pct)}">${sign(x.pnl_pct)}%</td>
        <td>${x.win? '<span class="green">WIN</span>':'<span class="red">LOSS</span>'}</td>
      </tr>`).join("")}
      </tbody></table>`;
  }
}

function card(label,val,c=""){
  return `<div class="card"><div class="label">${label}</div>
    <div class="val ${c}">${val}</div></div>`;
}

function stratCard(s){
  const open = s.open_side
    ? `<span class="tag ${s.open_side}">OPEN ${s.open_side} @ ${fmt(s.open_entry)}</span>`
    : "";
  return `<div class="strat">
    <div class="strat-head">
      <span class="dot ${s.enabled?'on':'off'}"></span>
      <span class="strat-name">${s.name}</span>
      <span class="tag">${s.symbol||"—"}</span>
      <span class="tag">${s.size_usdt!=null?s.size_usdt+" USDT":""}</span>
      ${s.enabled?'':'<span class="tag">disabled</span>'}
      ${open}
    </div>
    ${s.description?`<div class="strat-desc">${s.description}</div>`:""}
    <div class="metrics">
      <div class="metric"><div class="m-label">Live Win Rate</div>
        <div class="m-val">${s.live.win_rate}%</div></div>
      <div class="metric"><div class="m-label">Backtest</div>
        <div class="m-val muted">${s.backtest_win_rate||"—"}</div></div>
      <div class="metric"><div class="m-label">Trades</div>
        <div class="m-val">${s.live.trades}</div></div>
      <div class="metric"><div class="m-label">W / L</div>
        <div class="m-val"><span class="green">${s.live.wins}</span> / <span class="red">${s.live.losses}</span></div></div>
      <div class="metric"><div class="m-label">PnL</div>
        <div class="m-val ${cls(s.live.pnl)}">${sign(s.live.pnl)}</div></div>
    </div>
  </div>`;
}

load();
setInterval(load, 5000);
</script>
</body>
</html>
