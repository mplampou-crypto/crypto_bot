# Fly.io configuration.  Rename "app" to your own unique app name.
app = "crypto-bot"
primary_region = "fra"   # Frankfurt (close to Greece). Change if you like.

[build]

[env]
  PORT = "8080"

# Persistent disk so trades.db survives restarts/redeploys.
# Create it once:  fly volumes create data --size 1 --region fra
[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep the bot always running (it must receive webhooks + poll Telegram).
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
